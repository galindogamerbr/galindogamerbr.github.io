name: Atualizar última live do YouTube

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Encontrar última live realizada
        shell: python
        run: |
          import json, subprocess, datetime, pathlib

          url = 'https://www.youtube.com/@galindogamerbr/streams'
          cmd = [
              'yt-dlp', '--flat-playlist', '--playlist-end', '12',
              '--dump-single-json', '--skip-download', url
          ]
          result = subprocess.run(cmd, capture_output=True, text=True)
          if result.returncode != 0:
              raise SystemExit(result.stderr or 'yt-dlp falhou')

          data = json.loads(result.stdout)
          entries = data.get('entries') or []
          chosen = None

          # Preferimos a primeira entrada que não seja marcada como futura.
          for entry in entries:
              if not entry:
                  continue
              if entry.get('live_status') in ('is_upcoming', 'upcoming'):
                  continue
              chosen = entry
              break

          if chosen is None and entries:
              chosen = entries[0]
          if not chosen:
              raise SystemExit('Nenhuma live encontrada no canal.')

          video_id = chosen.get('id')
          title = chosen.get('title') or 'Última live do GalindoGamerBR'
          published = chosen.get('timestamp')
          published_iso = ''
          if published:
              published_iso = datetime.datetime.fromtimestamp(published, datetime.timezone.utc).isoformat()

          payload = {
              'videoId': video_id,
              'title': title,
              'publishedAt': published_iso,
              'thumbnail': f'https://i.ytimg.com/vi/{video_id}/maxresdefault.jpg',
              'url': f'https://www.youtube.com/watch?v={video_id}'
          }
          pathlib.Path('latest-live.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')

      - name: Publicar atualização
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest-live.json
          git diff --cached --quiet || git commit -m 'Atualiza última live do YouTube'
          git push
