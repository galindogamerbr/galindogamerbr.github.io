name: Atualizar última live do YouTube

on:
  push:
    branches:
      - main

  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-live:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Verificar workflow
        run: |
          echo "Workflow executado corretamente."
          echo "Branch: ${{ github.ref_name }}"

      - name: Atualizar arquivo latest-live.json
        run: |
          echo '{"status":"ready","message":"Sistema de atualização da última live ativado."}' > latest-live.json

      - name: Salvar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-live.json
          git diff --cached --quiet || git commit -m "Atualiza última live"
          git push
