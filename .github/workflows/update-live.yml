ETAPA 1 — Google Search Console
Vamos registrar:

galindogamerbr.com.br

no Google Search Console.

Vamos escolher:

Propriedade do domínio

e não "prefixo de URL".

Isso é importante porque a propriedade de domínio engloba o domínio e seus subdomínios, além das versões HTTP/HTTPS. 

O Google vai fornecer um registro TXT exclusivo para comprovar que o domínio é seu. 

⚠️ Mas atenção:
NÃO coloque nenhum TXT aleatório no Registro.br.

Primeiro vamos gerar o código dentro do Google Search Console.

Vamos fazer juntos agora
Abra:

Google Search Console

Entre com a conta Google que você usa para administrar o GalindoGamerBR.

Depois:

1. Clique em "Adicionar propriedade"

2. Escolha "Domínio"

3. Digite exatamente:

galindogamerbr.com.br
Sem:

https://
Sem:

www.
O Google confirma que, para propriedade de domínio, deve ser informado somente o domínio raiz. 

Quando aparecer o código TXT...
PARA. Não precisa fazer mais nada.

